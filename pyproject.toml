[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookipu"
version = "0.1.0"
description = "Next-Generation Publishing-as-Code Engine for Books and Digital Publications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "BooKipu Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.6.0"
]

[project.scripts]
bookipu = "bookipu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bookipu"]
